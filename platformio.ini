[env:esp32-s3-display]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Minneskonfiguration (16MB QIO Flash + 8MB Octal OPI PSRAM) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; --- Byggflaggor ---
build_flags =
    -DAMY_OSCS=120
    -DGAMMA9001
    -DPCM_LARGE
    -DAMY_HAS_I2S=1 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src/

; --- Linux Serial Monitor (förhindrar oavsiktlig reset via DTR/RTS) ---
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; --- Bibliotek ---
lib_deps =
    shorepine/AMY Synthesizer @ ^1.2.200
    moononournation/GFX Library for Arduino @ ^1.6.4
    bitbank2/bb_captouch @ ^1.2.1
    lvgl/lvgl @ ^8.3.11

